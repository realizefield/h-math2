    id:'ex24',num:'2-4',title:'\u5bfe\u6570\u65b9\u7a0b\u5f0f\u30fb\u4e0d\u7b49\u5f0f',
    sub:['\u5bfe\u6570\u65b9\u7a0b\u5f0f\u306e\u89e3\u304d\u65b9','\u5bfe\u6570\u4e0d\u7b49\u5f0f\u3068\u5358\u8abf\u6027','\u5bfe\u6570\u6570\u306e\u5927\u5c0f\u6bd4\u8f03'],
    group:'ex2b',ex2:true,
    btns:[{label:'\uD83D\uDCD6 \u5b66\u7fd2\u3059\u308b',href:'EX2-4.html',cls:'sc-btn-ex2'}]
  },
  {
    id:'ex25',num:'2-5',title:'\u5e38\u7528\u5bfe\u6570',
    sub:['\u5e38\u7528\u5bfe\u6570\u306e\u5b9a\u7fa9\uff08\u5e95=10\uff09','\u6841\u6570\u30fb\u6700\u9ad8\u4f4d\u306e\u6570\u5b57','\u5e38\u7528\u5bfe\u6570\u8868\u306e\u4f7f\u3044\u65b9'],
    group:'ex2b',ex2:true,
    btns:[{label:'\uD83D\uDCD6 \u5b66\u7fd2\u3059\u308b',href:'EX2-5.html',cls:'sc-btn-ex2'}]
  },
  {
    id:'ex26',num:'2-6',title:'\u5bfe\u6570\u95a2\u6570\u306e\u6700\u5927\u5024\u30fb\u6700\u5c0f\u5024',
    sub:['\u7f6e\u304d\u63db\u3048\u3067\u4e8c\u6b21\u95a2\u6570\u306b\u5909\u63db','\u6c7a\u5b9a\u5909\u6570\u306e\u5b9a\u7fa9\u57df\u306e\u5207\u308a\u51fa\u3057','\u5bfe\u6570\u306e\u52df\u5c55\u95a2\u6570\u3078\u306e\u5fdc\u7528'],
    group:'ex2b',ex2:true,
    btns:[{label:'\uD83D\uDCD6 \u5b66\u7fd2\u3059\u308b',href:'EX2-6.html',cls:'sc-btn-ex2'}]
  },
];

var KEY_GRADE=function(id){return 'math2_grade_'+id;};
var KEY_CNT  =function(id){return 'math2_cnt_'+id;};
var KEY_LAST =function(id){return 'math2_last_'+id;};
var getGrade=function(id){return localStorage.getItem(KEY_GRADE(id))||'';};
var getCount=function(id){return parseInt(localStorage.getItem(KEY_CNT(id))||'0');};
var getLast =function(id){return localStorage.getItem(KEY_LAST(id))||'';};

function setGrade(id,g){
  localStorage.setItem(KEY_GRADE(id),g);
  var d=new Date().toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'});
  localStorage.setItem(KEY_CNT(id),getCount(id)+1);
  localStorage.setItem(KEY_LAST(id),d);
}

function buildCards(){
  var grids={ex1a:'grid-ex1a',ex1b:'grid-ex1b',ex2a:'grid-ex2a',ex2b:'grid-ex2b'};
  UNITS.forEach(function(u){
    var el=document.createElement('div');
    el.className='sec-card'; el.dataset.id=u.id;
    var btnHtml=u.btns.map(function(b){return '<a href="'+b.href+'" class="sc-btn '+(b.cls||'')+'">'+ b.label+'</a>';}).join('');
    var isEx2=u.ex2;
    var hdCls=isEx2?' ex2-hd':'';
    var numCls=isEx2?' ex2-num':'';
    var titleCls=isEx2?' ex2-title':'';
    el.innerHTML=
      '<div class="sc-hd'+hdCls+'">'
      +'<span class="sc-num'+numCls+'">'+u.num+'</span>'
      +'<span class="sc-title'+titleCls+'">'+u.title+'</span>'
      +'<span class="sc-status" id="st-'+u.id+'">\u672A\u5B66\u7FD2</span>'
      +'</div>'
      +'<div class="sc-body"><ul class="sc-topics">'+u.sub.map(function(s){return '<li'+(isEx2?' class="ex2"':'')+'>'+s+'</li>';}).join('')+'</ul></div>'
      +'<div class="sc-meta">'
      +'<div class="sc-meta-item">\uD83D\uDCD6 \u5B66\u7FD2\u56DE\u6570 <span class="sc-meta-val" id="cnt-'+u.id+'">0</span></div>'
      +'<div class="sc-meta-item">\uD83D\uDCC5 \u6700\u7D42\u65E5 <span class="sc-meta-val" id="last-'+u.id+'">\u2015</span></div>'
      +'</div>'
      +'<div class="sc-btn-row">'+btnHtml+'</div>'
      +'<div class="abc-row">'
      +'<span class="abc-lbl">\u7406\u89E3\u5EA6\uFF1A</span>'
      +'<button class="abc-btn abc-a" onclick="rate(\''+u.id+'\',\'a\',this)">A \u5B8C\u74A7</button>'
      +'<button class="abc-btn abc-b" onclick="rate(\''+u.id+'\',\'b\',this)">B \u826F\u597D</button>'
      +'<button class="abc-btn abc-c" onclick="rate(\''+u.id+'\',\'c\',this)">C \u8981\u5FA9\u7FD2</button>'
      +'</div>';
    document.getElementById(grids[u.group]).appendChild(el);
  });
}

function rate(id,g,btn){
  setGrade(id,g); render();
  var msgs={
    a:['\uD83C\uDF1F','\u5B8C\u74A7\uFF01','\u3053\u306E\u8ABF\u5B50\u3067\u3069\u3093\u3069\u3093\u9032\u3082\u3046\uFF01'],
    b:['\uD83D\uDCD8','\u826F\u597D\uFF01','\u3082\u3046\u4E00\u5EA6\u5FA9\u7FD2\u3059\u308B\u3068\u3055\u3089\u306B\u5B9A\u7740\u3059\u308B\u3088\u3002'],
    c:['\uD83D\uDCCC','\u8981\u5FA9\u7FD2','\u82E6\u624B\u90E8\u5206\u3092\u3082\u3046\u4E00\u5EA6\u78BA\u8A8D\u3057\u3066\u307F\u3088\u3046\u3002']
  };
  var m=msgs[g];
  document.getElementById('modal-emoji').textContent=m[0];
  document.getElementById('modal-title').textContent=m[1];
  document.getElementById('modal-sub').textContent=m[2];
  document.getElementById('modal').classList.add('open');
  if(g==='a') launchConfetti();
}

function render(){
  var ca=0,cb=0,cc=0,cn=0;
  UNITS.forEach(function(u){
    var g=getGrade(u.id); var cnt=getCount(u.id); var last=getLast(u.id);
    var card=document.querySelector('[data-id="'+u.id+'"]');
    if(card){
      card.classList.remove('s-a','s-b','s-c');
      if(g) card.classList.add('s-'+g);
      card.querySelectorAll('.abc-btn').forEach(function(b){b.classList.remove('sel');if(b.classList.contains('abc-'+g))b.classList.add('sel');});
    }
    var ce=document.getElementById('cnt-'+u.id); if(ce)ce.textContent=cnt;
    var le=document.getElementById('last-'+u.id); if(le)le.textContent=last||'\u2015';
    var st=document.getElementById('st-'+u.id);
    if(st){
      if(g==='a'){st.className='sc-status done';st.textContent='\u2705 \u5B8C\u74A7';}
      else if(g==='b'){st.className='sc-status partial';st.textContent='\uD83D\uDCD8 \u826F\u597D';}
      else if(g==='c'){st.className='sc-status partial';st.textContent='\uD83D\uDCCC \u8981\u5FA9\u7FD2';}
      else if(cnt>0){st.className='sc-status studying';st.textContent='\u5B66\u7FD2\u4E2D';}
      else{st.className='sc-status';st.textContent='\u672A\u5B66\u7FD2';}
    }
    if(g==='a')ca++; else if(g==='b')cb++; else if(g==='c')cc++; else cn++;
  });
  var total=UNITS.length;
  document.getElementById('cnt-a').textContent=ca;
  document.getElementById('cnt-b').textContent=cb;
  document.getElementById('cnt-c').textContent=cc;
  document.getElementById('cnt-n').textContent=cn;
  var pct=total?Math.round(ca/total*100):0;
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progPct').innerHTML=pct+'%\u3000A\u8A55\u4FA1 <span id="progNote">'+ca+' / '+total+'</span> \u5358\u5143';
  buildRecord();
}

function buildRecord(){
  var el=document.getElementById('record-list'); el.innerHTML='';
  UNITS.forEach(function(u){
    var g=getGrade(u.id); var cnt=getCount(u.id); var last=getLast(u.id);
    var gradeLabel=g?{a:'A \u5B8C\u74A7',b:'B \u826F\u597D',c:'C \u8981\u5FA9\u7FD2'}[g]:'\u672A\u5B66\u7FD2';
    var gradeClass=g?' '+g:'';
    var row=document.createElement('div'); row.className='prog-row';
    row.innerHTML='<div class="prog-num'+(u.ex2?' ex2-pnum':'')+'">'+u.num+'</div><div class="prog-title">'+u.title+'</div><div class="prog-grade'+gradeClass+'">'+gradeLabel+'</div><div class="prog-meta">'+cnt+'\u56DE / '+(last||'\u2015')+'</div>';
    el.appendChild(row);
  });
}

function switchTab(id,btn){
  document.querySelectorAll('.tab-sec').forEach(function(s){s.classList.remove('on');});
  document.querySelectorAll('.tnav').forEach(function(b){b.classList.remove('on');});
  document.getElementById(id).classList.add('on'); btn.classList.add('on');
}

function closeModal(){document.getElementById('modal').classList.remove('open');}

function launchConfetti(){
  var cvs=document.getElementById('cnf');
  cvs.width=innerWidth; cvs.height=innerHeight; cvs.style.display='block';
  var ctx=cvs.getContext('2d');
  var parts=[];
  var cols=['#f472b6','#facc15','#34d399','#60a5fa','#f87171','#a78bfa'];
  for(var i=0;i<120;i++){
    parts.push({x:Math.random()*innerWidth,y:-10,vx:(Math.random()-.5)*4,vy:Math.random()*4+2,r:Math.random()*6+3,color:cols[Math.floor(Math.random()*6)],rot:Math.random()*360,rv:(Math.random()-.5)*8});
  }
  var frame;
  function draw(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    parts.forEach(function(p){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore();
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.rv;
    });
    if(parts.some(function(p){return p.y<innerHeight;})){frame=requestAnimationFrame(draw);}
    else{cvs.style.display='none';cancelAnimationFrame(frame);}
  }
  draw();
  setTimeout(function(){cvs.style.display='none';cancelAnimationFrame(frame);},3500);
}

document.addEventListener('DOMContentLoaded',function(){buildCards();render();});
</script>
